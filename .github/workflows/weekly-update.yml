name: Weekly Dashboard Update

on:
  schedule:
    - cron: '0 8 * * 0'  # Every Sunday at 8:00 UTC (11:00 Israel time)
  workflow_dispatch: {}    # Manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest data from Google Sheets
        run: bash fetch.sh

      - name: Preprocess conversations
        run: python3 preprocess.py

      - name: Analyze conversations
        run: python3 batch_analyze.py

      - name: Generate overview reports
        run: python3 generate_overview.py

      - name: Copy updated data to site
        run: cp dashboard_data.json site/dashboard_data.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Weekly data update $(date +%Y-%m-%d)"
          git push
